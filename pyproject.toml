[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nadeepra-lorarank"
version = "0.1.0"
description = "按秩扫描训练成本与效果变化，标出收益饱和点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nadeepra" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nadeepra.github.io"
Repository = "https://github.com/nadeepra/lorarank"
Issues = "https://github.com/nadeepra/lorarank/issues"

[project.scripts]
lorarank = "lorarank:main"

[tool.setuptools]
py-modules = ["lorarank"]
